appId: com.pacificnm.tabking
productName: Tab King
copyright: Copyright © 2026 Jaimie Garner
artifactName: tab-king-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - resources/**
  - '!**/*.map'
asar: true
# better-sqlite3 ships N-API prebuilds (one binary for Node and Electron), so no native rebuild is needed.
npmRebuild: false
linux:
  target: [AppImage, deb]
  category: AudioVideo
  icon: build/icon.png
  maintainer: Jaimie Garner <pacificnm@gmail.com>
  synopsis: Guitar tab player
  desktop:
    entry:
      Name: Tab King
      Comment: Guitar tab player with synced MP3 audio
      Keywords: guitar;tab;tablature;guitar pro;music;
deb:
  depends:
    [
      libgtk-3-0,
      libnotify4,
      libnss3,
      libxss1,
      libxtst6,
      xdg-utils,
      libatspi2.0-0,
      libuuid1,
      libsecret-1-0
    ]
win:
  target: [nsis, portable]
  icon: build/icon.png
# NSIS and portable share the platform/arch, so the portable build gets its own file name.
portable:
  artifactName: tab-king-${version}-${os}-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Tab King
  uninstallDisplayName: Tab King
mac:
  target: [dmg, zip]
  category: public.app-category.music
  icon: build/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Tab King ${version}
publish: null
