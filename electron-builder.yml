appId: com.pacificnm.tabking
productName: Tab King
copyright: Copyright © 2026 Jaimie Garner
artifactName: tab-king-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - resources/**
  - '!**/*.map'
asar: true
npmRebuild: true
linux:
  target: [AppImage, deb]
  category: AudioVideo
  icon: build/icon.png
  maintainer: Jaimie Garner <pacificnm@gmail.com>
  synopsis: Guitar tab player
deb:
  depends:
    [
      libgtk-3-0,
      libnotify4,
      libnss3,
      libxss1,
      libxtst6,
      xdg-utils,
      libatspi2.0-0,
      libuuid1,
      libsecret-1-0
    ]
win:
  target: [nsis, portable]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg, zip]
  category: public.app-category.music
  icon: build/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Tab King ${version}
publish: null
