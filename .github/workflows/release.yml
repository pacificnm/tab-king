name: Release

# Push a tag like v0.1.0 (matching package.json) to build every platform and publish a GitHub Release.
# Run manually (workflow_dispatch) for a dry run: builds and uploads artifacts, publishes nothing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        name: Check version and changelog
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
              exit 1
            fi
            if ! grep -qE "^## \[?$version\]?( |$)" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version"
              exit 1
            fi
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, args: --linux --x64, target: 'linux x64' }
          - {
              name: linux-arm64,
              os: ubuntu-24.04-arm,
              args: --linux --arm64,
              target: 'linux arm64'
            }
          - { name: windows-x64, os: windows-latest, args: --win --x64, target: 'win x64' }
          - { name: macos-x64, os: macos-15-intel, args: --mac --x64, target: 'mac x64' }
          - { name: macos-arm64, os: macos-latest, args: --mac --arm64, target: 'mac arm64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run license:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Export signing secrets (only those that are set)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # electron-builder treats an empty CSC_LINK as a path, so never export empty values.
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Check the installers have the documented names
        run: node scripts/check-artifacts.mjs ${{ matrix.target }}
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke test the packaged app
        shell: bash
        env:
          TABKING_STARTUP_BUDGET_MS: '15000'
        run: |
          export TABKING_EXE="$(node scripts/packaged-exe.mjs)"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npx playwright test tests/e2e/smoke.spec.ts
          else
            npx playwright test tests/e2e/smoke.spec.ts
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tab-king-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip

  release:
    needs: [verify, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: |
          v='${{ needs.verify.outputs.version }}'
          awk -v v="$v" '
            $0 ~ "^## \\[?" v "\\]?( |$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $v" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "Tab King $GITHUB_REF_NAME" --notes-file notes.md $flags
